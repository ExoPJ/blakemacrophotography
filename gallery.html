<body data-page="gallery" data-theme="green" data-bg="vines">

<header class="nav">

  <nav><ul>
    <li><a data-page="home" href="index.html">Home</a></li>

<main>
<p class="eyebrow">Gallery</p><h1 class="page-title">Gallery</h1><p class="lede">Click any photo to enlarge it.</p>

<div class="grid" id="grid"></div>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">

  <aside class="lb-side">
    <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
    <p class="eyebrow" id="lb-eyebrow"></p><h2 id="lb-title"></h2><p class="sub" id="lb-sub"></p><p id="lb-desc"></p>
  </aside>
</div>
</main>
<footer>© Blake Portfolio</footer>
